ay","lightgray","lightgray","royalblue","midnightblue","lemonchiffon","lemonchiffon","lemonchiffon","lemonchiffon","lemonchiffon","lemonchiffon","lemonchiffon","lemonchiffon","teal","teal","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","indianred","teal","darkgreen","darkgreen","darkgreen","darkgreen","palegreen","palegreen","palegreen","palegreen","palegreen","palegreen","plum","plum","plum","lightgray","lightgray","lightgreen","lightgreen","lightgreen","lightgreen","lime","lime","lime","lime","lime","lime","lime","gold","gold","mediumblue","mediumblue","mediumblue","mediumblue","mediumblue","lightblue","mediumblue","mediumblue","salmon","salmon","salmon","salmon","salmon","darkolivegreen","darkolivegreen","limegreen","limegreen","mediumblue","lemonchiffon","mediumblue","gold"],"line":{"color":"white","width":2},"showscale":false,"size":25},"mode":"markers","text":["policy_environment\u003cbr\u003e\u003cbr\u003eThe policy environment at a particular date.","evaluation_date_str\u003cbr\u003e\u003cbr\u003eThe date to be used as evaluation date in YYYY-MM-DD format.\u003cbr\u003e\u003cbr\u003eWill be overridden by values for year \u002f month \u002f day found in the input data or\u003cbr\u003eparameters.","policy_date\u003cbr\u003e\u003cbr\u003eThe date to be used as policy date.\u003cbr\u003e\u003cbr\u003eWill also be used as evaluation date in case that is neither provided as an argument\u003cbr\u003eto `main` nor as part of the input data \u002f parameters.","policy_date_str\u003cbr\u003e\u003cbr\u003eThe date to be used as policy date in YYYY-MM-DD format.\u003cbr\u003e\u003cbr\u003eWill also be used as evaluation date in case that is neither provided as an argument\u003cbr\u003eto `main` nor as part of the input data \u002f parameters.","backend\u003cbr\u003e\u003cbr\u003eThe name of the backend to use for the taxes and transfers function.","dnp\u003cbr\u003e\u003cbr\u003eThe backend used for datetime objects (numpy or jax-datetime).","xnp\u003cbr\u003e\u003cbr\u003eThe actual backend used for numerical operations (numpy or jax.numpy).","computation_currency\u003cbr\u003e\u003cbr\u003eThe currency the computation runs in — the policy date's statutory currency.\u003cbr\u003e\u003cbr\u003eRead off the dated mapping the policy system declares.","data_currency\u003cbr\u003e\u003cbr\u003eThe currency the user's data arrives in and results are returned in.\u003cbr\u003e\u003cbr\u003eDefaults to the policy system's base currency. Override via\u003cbr\u003e``main(data_currency=...)`` with another of the system's currencies.","input_data_in_computation_currency\u003cbr\u003e\u003cbr\u003eThe input data with every value a bare magnitude in the computation currency.\u003cbr\u003e\u003cbr\u003eInput columns arrive in the data currency — a unit-annotated column crossed\u003cbr\u003einto it at its own boundary — so the crossing into the computation currency\u003cbr\u003eis one uniform factor applied to every currency-valued column.","processed_data\u003cbr\u003e\u003cbr\u003eThe internal processed data for use in the taxes and transfers function.\u003cbr\u003e\u003cbr\u003eWe replace identifiers by consecutive integers starting at zero and sort the data\u003cbr\u003eaccording to the original `p_id`. Values arrive already denominated in the\u003cbr\u003ecomputation currency.\u003cbr\u003e\u003cbr\u003eThe transformations will be undone when going from raw results to results.","labels\u003cbr\u003eall_qnames_in_policy_environment\u003cbr\u003e\u003cbr\u003eThe (qualified) names of all objects in the policy environment.","labels\u003cbr\u003ecolumn_targets\u003cbr\u003e\u003cbr\u003eThe (qualified) names of the targets that are column functions.","labels\u003cbr\u003egrouping_levels\u003cbr\u003e\u003cbr\u003eThe grouping levels of the policy environment.","labels\u003cbr\u003einput_data_targets\u003cbr\u003e\u003cbr\u003eThe (qualified) names of the targets that are already present in the input data.","labels\u003cbr\u003eparam_targets\u003cbr\u003e\u003cbr\u003eThe (qualified) names of the targets that are parameters or param functions.","labels\u003cbr\u003epolicy_inputs\u003cbr\u003e\u003cbr\u003eThe (qualified) names of the policy inputs in the policy environment.","labels\u003cbr\u003eroot_nodes\u003cbr\u003e\u003cbr\u003eThe (qualified) names of those columns in `processed_data` which are required for\u003cbr\u003ethe tax transfer function.","labels\u003cbr\u003etop_level_namespace\u003cbr\u003e\u003cbr\u003eThe elements of the top level namespace.","tt_function\u003cbr\u003e\u003cbr\u003eReturn the function calculating the taxes and transfers.","tt_function_set_annotations\u003cbr\u003e\u003cbr\u003eWhether to set annotations on the tax-transfer function.\u003cbr\u003e\u003cbr\u003eDefaults to true, turn off in case you run into trouble with type annotations when\u003cbr\u003emodifying the policy environment.","fail_if\u003cbr\u003eactive_periods_overlap\u003cbr\u003e\u003cbr\u003eFail because active periods of objects \u002f parameters overlap.\u003cbr\u003e\u003cbr\u003eChecks that objects or parameters with the same tree path \u002f qualified name are not\u003cbr\u003eactive at the same time.\u003cbr\u003e\u003cbr\u003eRaises:\u003cbr\u003e    ConflictingActivePeriodsError: If multiple objects and\u002for parameters with the\u003cbr\u003e        same leaf name are active at the same time.","fail_if\u003cbr\u003eany_paths_are_invalid\u003cbr\u003e\u003cbr\u003eFail if any paths are invalid in the policy environment.","fail_if\u003cbr\u003ebackend_has_changed\u003cbr\u003e\u003cbr\u003eFail if the backend has changed.","fail_if\u003cbr\u003eforeign_keys_are_invalid_in_data\u003cbr\u003e\u003cbr\u003eCheck that all foreign keys are valid.\u003cbr\u003e\u003cbr\u003eForeign keys must point to an existing `p_id` in the input data and must not refer\u003cbr\u003eto the `p_id` of the same row.\u003cbr\u003e\u003cbr\u003eWe test this only in the columns that are actually used, not in some `p_id_xxx`\u003cbr\u003ecolumn that may be present in the data.","fail_if\u003cbr\u003egroup_ids_are_outside_top_level_namespace\u003cbr\u003e\u003cbr\u003eFail if group ids are outside the top level namespace.","fail_if\u003cbr\u003egroup_variables_are_not_constant_within_groups\u003cbr\u003e\u003cbr\u003eFail if group-level variables are not constant within a group.","fail_if\u003cbr\u003einput_currency_is_not_concrete\u003cbr\u003e\u003cbr\u003eFail if a currency-bearing input column names the agnostic ``CURRENCY``.\u003cbr\u003e\u003cbr\u003eInput data, like a parameter, is written in a concrete currency: a currency column\u003cbr\u003emust name one, never the agnostic ``TTSIMUnit.CURRENCY`` — which would leave the run\u003cbr\u003eunable to tell what the numbers are denominated in.\u003cbr\u003e\u003cbr\u003eRaises:\u003cbr\u003e    UnitConsistencyError: If any input column's tag is an agnostic currency.","fail_if\u003cbr\u003einput_data_has_int_or_bool_missing_values\u003cbr\u003e\u003cbr\u003eFail when an integer or boolean input column has missing values.\u003cbr\u003e\u003cbr\u003eNeither numpy integer nor numpy boolean dtypes have a missing-value\u003cbr\u003esentinel. Surface the columns and their first offending row position so\u003cbr\u003ethe user can fill the missing values.","fail_if\u003cbr\u003einput_data_has_object_dtype_columns\u003cbr\u003e\u003cbr\u003eFail when an input column has object dtype.\u003cbr\u003e\u003cbr\u003eThe taxes-and-transfers DAG operates on numeric and boolean arrays. Object arrays\u003cbr\u003ecannot safely participate in arithmetic and must not reach input processing or\u003cbr\u003ecurrency conversion.","fail_if\u003cbr\u003einput_data_is_invalid\u003cbr\u003e\u003cbr\u003eFail if the input data is invalid.\u003cbr\u003e\u003cbr\u003eFails if:\u003cbr\u003e    - The `p_id` column is missing.\u003cbr\u003e    - The `p_id` column has non-integer values.\u003cbr\u003e    - The `p_id` column has non-unique values.\u003cbr\u003e    - The input arrays have different lengths.","fail_if\u003cbr\u003einput_data_tree_is_invalid\u003cbr\u003e\u003cbr\u003eValidate the basic structure of the input data tree.","fail_if\u003cbr\u003einput_data_uint64_values_overflow_int64\u003cbr\u003e\u003cbr\u003eFail when a uint64 input column has any value outside the int64 range.\u003cbr\u003e\u003cbr\u003eUint columns are coerced to int64 in ``processed_data`` so that signed\u003cbr\u003earithmetic on them stays signed. Values in ``(int64.max, uint64.max]``\u003cbr\u003ecannot be represented as int64 and would silently wrap; surface them as\u003cbr\u003ean error.\u003cbr\u003e\u003cbr\u003eCatches raw ``numpy.uint64`` arrays supplied via ``InputData.flat`` \u002f\u003cbr\u003e``InputData.tree`` \u002f ``InputData.qname`` that survive into\u003cbr\u003e``input_data__flat`` with their dtype intact. DataFrame and ``pd.Series``\u003cbr\u003einputs go through ``_canonicalize_input_dtype`` earlier and raise the\u003cbr\u003esame kind of error there before the cast.","fail_if\u003cbr\u003einput_df_has_bool_or_numeric_column_names\u003cbr\u003e\u003cbr\u003eFail if the DataFrame has bool or numeric column names.","fail_if\u003cbr\u003einput_df_mapper_columns_missing_in_df\u003cbr\u003e\u003cbr\u003eFail if the input mapper specifies columns that are not in the input dataframe.","fail_if\u003cbr\u003einput_df_mapper_has_incorrect_format\u003cbr\u003e\u003cbr\u003eFail if the input mapper has an incorrect format.\u003cbr\u003e\u003cbr\u003eFails if:\u003cbr\u003e    - The input mapper is not a valid TTSIM pytree.\u003cbr\u003e    - The input mapper has non-string paths.","fail_if\u003cbr\u003einput_df_mapper_p_id_is_missing\u003cbr\u003e\u003cbr\u003eFail if the input mapper does not include a mapping for 'p_id'.","fail_if\u003cbr\u003einput_units_are_inconsistent\u003cbr\u003e\u003cbr\u003eFail if a tagged input column's unit contradicts its declared unit in the DAG.\u003cbr\u003e\u003cbr\u003eRaises:\u003cbr\u003e    UnitConsistencyError: If any tagged column disagrees with its declared\u003cbr\u003e        unit.","fail_if\u003cbr\u003enon_convertible_objects_in_results_tree\u003cbr\u003e\u003cbr\u003eFail if results should be converted to a DataFrame but cannot.","fail_if\u003cbr\u003eparam_function_depends_on_column_objects\u003cbr\u003e\u003cbr\u003eFail if any ParamFunction depends on ColumnObject arguments.","fail_if\u003cbr\u003epaths_are_missing_in_targets_tree_mapper\u003cbr\u003e\u003cbr\u003eFail if the data paths are missing in the mapping of paths to column names.","fail_if\u003cbr\u003epolicy_environment_is_invalid\u003cbr\u003e\u003cbr\u003eValidate that the environment is a pytree with supported types.","fail_if\u003cbr\u003etargets_are_not_in_specialized_environment_or_data\u003cbr\u003e\u003cbr\u003eFail if some target is not among functions.","fail_if\u003cbr\u003etargets_tree_is_invalid\u003cbr\u003e\u003cbr\u003eValidate that the targets tree is a dictionary with string keys and None leaves.","fail_if\u003cbr\u003ett_dag_includes_function_with_fail_msg_if_included_set\u003cbr\u003e\u003cbr\u003eFail if the TT DAG includes functions that are marked as invalid.","fail_if\u003cbr\u003ett_root_nodes_are_missing\u003cbr\u003e\u003cbr\u003eFail if root nodes are missing.","fail_if\u003cbr\u003ett_units_are_inconsistent\u003cbr\u003e\u003cbr\u003eFail if a function body infers a unit that contradicts its declaration.\u003cbr\u003e\u003cbr\u003eEach body is unit-checked on representative values built from its producers'\u003cbr\u003eresolved units, across every reachable branch path, without any user data.\u003cbr\u003e\u003cbr\u003eRaises:\u003cbr\u003e    UnitConsistencyError: If any body infers a concrete unit that\u003cbr\u003e        disagrees with its declaration, or cannot be evaluated and has not\u003cbr\u003e        opted out via `verify_units=False`.","fail_if\u003cbr\u003ett_units_are_missing\u003cbr\u003e\u003cbr\u003eFail if any active node lacks a mandatory unit declaration.\u003cbr\u003e\u003cbr\u003eRaises:\u003cbr\u003e    UnitDefinitionError: If any node (or dict-parameter leaf) lacks a\u003cbr\u003e        unit declaration.","rounding\u003cbr\u003e\u003cbr\u003eWhether to apply rounding to policy functions.","specialized_environment\u003cbr\u003ett_dag\u003cbr\u003e\u003cbr\u003eThe taxes-transfers DAG.","specialized_environment\u003cbr\u003ewith_partialled_params_and_scalars\u003cbr\u003e\u003cbr\u003eThe policy environment where all parameters and scalars have been partialed into\u003cbr\u003ethe column functions.","specialized_environment\u003cbr\u003ewith_processed_params_and_scalars\u003cbr\u003e\u003cbr\u003eThe policy environment where all parameters and param functions have been processed.\u003cbr\u003e\u003cbr\u003eAll RawParams have been removed (note that a RawParam object is pointless without a\u003cbr\u003eparam function making use of it).","specialized_environment\u003cbr\u003ewithout_tree_logic_and_with_derived_functions\u003cbr\u003e\u003cbr\u003eReturn a flat policy environment which includes derived functions.\u003cbr\u003e\u003cbr\u003eTwo steps:\u003cbr\u003e1. Remove all tree logic from the policy environment.\u003cbr\u003e2. Add derived functions to the policy environment.","specialized_environment_for_plotting_and_templates\u003cbr\u003ecomplete_tt_dag\u003cbr\u003e\u003cbr\u003eThe complete DAG, which includes parameters and param_functions.\u003cbr\u003e\u003cbr\u003eIf tt_targets are specified, only nodes that are ancestors or descendants of the\u003cbr\u003etargets are kept. If no tt_targets are specified, the entire DAG is returned.","specialized_environment_for_plotting_and_templates\u003cbr\u003eqnames_to_derive_functions_from\u003cbr\u003e\u003cbr\u003eThe qnames to derive functions from.\u003cbr\u003e\u003cbr\u003eDerived functions should be created based on the actual input columns, and the\u003cbr\u003epolicy inputs (if their base name is not already in the input columns).","specialized_environment_for_plotting_and_templates\u003cbr\u003ewith_partialled_params_and_scalars\u003cbr\u003e\u003cbr\u003eThe policy environment where all parameters and scalars have been partialed into\u003cbr\u003ethe column functions.\u003cbr\u003e\u003cbr\u003eThe difference to the corresponding function in `specialized_environment` is that\u003cbr\u003epolicy inputs may be considered like actual inputs.","specialized_environment_for_plotting_and_templates\u003cbr\u003ewith_processed_params_and_scalars\u003cbr\u003e\u003cbr\u003eThe environment where all parameters and param functions have been processed.\u003cbr\u003e\u003cbr\u003eAll RawParams have been removed (note that a RawParam object is pointless without a\u003cbr\u003eparam function making use of it).\u003cbr\u003e\u003cbr\u003eThe difference to the corresponding function in `specialized_environment` is that\u003cbr\u003epolicy inputs may be considered like actual inputs.","specialized_environment_for_plotting_and_templates\u003cbr\u003ewithout_input_data_nodes_with_dummy_callables\u003cbr\u003e\u003cbr\u003eAn environment where non-callable are transformed into callables so we can use\u003cbr\u003edags to set up the DAG for plotting and templates.","specialized_environment_for_plotting_and_templates\u003cbr\u003ewithout_tree_logic_and_with_derived_functions\u003cbr\u003e\u003cbr\u003eA flat policy environment with derived functions.\u003cbr\u003e\u003cbr\u003eThe difference to the corresponding function in `specialized_environment` is that\u003cbr\u003epolicy inputs may be considered like actual inputs.","unit_checks\u003cbr\u003edeclared_ttsim_units\u003cbr\u003e\u003cbr\u003eEach node's declared TTSIM unit, by qname.","unit_checks\u003cbr\u003eresolved_pint_units\u003cbr\u003e\u003cbr\u003eThe pint unit every annotated node's declared TTSIM unit resolves to.","unit_checks\u003cbr\u003evalidation_report\u003cbr\u003e\u003cbr\u003eAuditable declaration, body, rule, cast, and opt-out coverage.","unit_system\u003cbr\u003e\u003cbr\u003eThe policy system's currencies and statutory-currency mapping.\u003cbr\u003e\u003cbr\u003eA user-supplied leaf, like ``orig_policy_objects__root``: a policy package\u003cbr\u003edeclares one :class:`~ttsim.tt.units.UnitSystem` at import and passes it\u003cbr\u003eto ``main(unit_system=...)``. Packages wrapping ``main`` (GETTSIM) default it\u003cbr\u003eto their own, so their users never name it.","len_p_id\u003cbr\u003e\u003cbr\u003eThe length of `p_id`, i.e. the number of observations (``n_obs``).\u003cbr\u003e\u003cbr\u003eEvery column in `processed_data` has this length, so it is read off the first one.\u003cbr\u003eIt serves two purposes:\u003cbr\u003e\u003cbr\u003e- It is the segment count for jax segment sums. The number of distinct groups for\u003cbr\u003e  any group identifier is at most ``n_obs``, so ``n_obs`` is a safe upper bound;\u003cbr\u003e  aggregation functions receive it under the name ``num_segments`` (see\u003cbr\u003e  `specialized_environment.with_partialled_params_and_scalars`).\u003cbr\u003e- It is the population length used to broadcast scalar inputs to non-vectorized\u003cbr\u003e  functions (see `specialized_environment._broadcast_scalar_columns_at_call_time`).","raw_results\u003cbr\u003ecolumns_with_internal_p_ids\u003cbr\u003e\u003cbr\u003eThe raw results of the TT function that have been requested as targets.\u003cbr\u003e\u003cbr\u003eArrays are sorted according to the internal sort order. Endogenously- computed\u003cbr\u003e`p_id_*` columns hold internal indices; see `columns_with_remapped_ids` for the\u003cbr\u003eversion with user-space `p_id` values.","raw_results\u003cbr\u003ecolumns_with_original_p_ids\u003cbr\u003e\u003cbr\u003eRaw results with endogenous `p_id_*` columns remapped to user-space `p_id`s.\u003cbr\u003e\u003cbr\u003eArrays are sorted according to the internal sort order. Endogenously-\u003cbr\u003ecomputed `p_id_*` columns hold internal indices; those are reverse-\u003cbr\u003etranslated to user-space `p_id` values here so consumers downstream see\u003cbr\u003ethe original identifiers (with `-1` preserved as the no-link sentinel).","raw_results\u003cbr\u003efrom_input_data\u003cbr\u003e\u003cbr\u003eThe input data columns that have been requested as targets.\u003cbr\u003e\u003cbr\u003eArrays are sorted as they are in the input data.","raw_results\u003cbr\u003eparams\u003cbr\u003e\u003cbr\u003eThe parameters that have been requested as targets.\u003cbr\u003e\u003cbr\u003ePossibly includes outputs of param_functions.","results\u003cbr\u003edf_with_mapper\u003cbr\u003e\u003cbr\u003eThe results DataFrame with mapped column names.","results\u003cbr\u003edf_with_nested_columns\u003cbr\u003e\u003cbr\u003eThe results DataFrame with nested column names corresponding to tree paths.","results\u003cbr\u003edf_with_qname_columns\u003cbr\u003e\u003cbr\u003eResults DataFrame with qname-string columns (one flat string per column).","results\u003cbr\u003eflat\u003cbr\u003e\u003cbr\u003eResults as a flat mapping of tree-path tuples to result leaves.","results\u003cbr\u003eqname\u003cbr\u003e\u003cbr\u003eResults as a flat mapping of qualified-name strings to result leaves.","results\u003cbr\u003etree\u003cbr\u003e\u003cbr\u003eThe combined results as a tree with original row order restored.\u003cbr\u003e\u003cbr\u003eCurrency-denominated computed columns are converted from the computation currency to\u003cbr\u003ethe data currency here. Requested parameters keep their statutory values; input\u003cbr\u003ecolumns requested as targets are returned exactly as provided, hence already in the\u003cbr\u003edata currency.","results\u003cbr\u003etree_with_unit_annotations\u003cbr\u003e\u003cbr\u003eThe combined results as a tree of :class:`UnitAnnotatedColumn` leaves.\u003cbr\u003e\u003cbr\u003eLike :func:`tree`, but every leaf is wrapped in a ``UnitAnnotatedColumn``\u003cbr\u003ewhose unit is spelled in the currency its value is denominated in:\u003cbr\u003e\u003cbr\u003e- an input column returned as a target and a computed column carry the data\u003cbr\u003e  currency (the value crossed to it at the boundary);\u003cbr\u003e- a requested parameter keeps its statutory value, so it carries the\u003cbr\u003e  computation currency and is never relabelled to the data currency (GEP 10).\u003cbr\u003e\u003cbr\u003eA parameter whose value is a mapping (a ``dict`` parameter) is annotated leaf\u003cbr\u003eby leaf: its resolved unit is either one unit covering the whole structure or\u003cbr\u003ea nested mapping mirroring it, and each numeric leaf is wrapped individually.\u003cbr\u003e\u003cbr\u003eA leaf with no resolved unit is left bare.","orig_policy_objects\u003cbr\u003ecolumn_objects_and_param_functions\u003cbr\u003e\u003cbr\u003eThe original ColumnObjectParamFunctions dictionary.\u003cbr\u003e\u003cbr\u003e\"Original\" means:\u003cbr\u003e- Module names are not removed from the path.\u003cbr\u003e- The last path element is the ColumnObject's original name, not the leaf name.","orig_policy_objects\u003cbr\u003eparam_specs\u003cbr\u003e\u003cbr\u003eThe original parameter specifications, typically loaded from yaml files.\u003cbr\u003e\u003cbr\u003e\"Original\" means:\u003cbr\u003e- Module names are not removed from the path.\u003cbr\u003e- The outermost key in each yaml file becomes the leaf name of the tree path.\u003cbr\u003e  Beyond that, the contents of the yaml files are not parsed.","input_data\u003cbr\u003edf_and_mapper\u003cbr\u003edf\u003cbr\u003e\u003cbr\u003eA DataFrame with input data and arbitrary column names.","input_data\u003cbr\u003edf_and_mapper\u003cbr\u003emapper\u003cbr\u003e\u003cbr\u003eA dictionary mapping expected tree paths to column names in the input DataFrame.","input_data\u003cbr\u003edf_with_nested_columns\u003cbr\u003e\u003cbr\u003eA DataFrame with nested column names corresponding to the expected tree paths.","input_data\u003cbr\u003edf_with_qname_columns\u003cbr\u003e\u003cbr\u003eA DataFrame whose flat column index holds qualified-name strings.","input_data\u003cbr\u003eqname\u003cbr\u003e\u003cbr\u003eThe input data as a flat dictionary keyed by qualified names.","input_data\u003cbr\u003esort_indices\u003cbr\u003e\u003cbr\u003eSort indices for restoring the original row order.","input_data\u003cbr\u003etree\u003cbr\u003e\u003cbr\u003eThe input data as a nested dictionary of arrays.","input_data\u003cbr\u003etree_with_unit_annotations\u003cbr\u003e\u003cbr\u003eThe input data as a nested dict of :class:`UnitAnnotatedColumn` leaves.\u003cbr\u003e\u003cbr\u003eLike :func:`tree`, but each leaf tags its column with a concrete unit, opting into\u003cbr\u003eboundary unit validation against the DAG. Use bare :func:`tree` for untagged data.\u003cbr\u003e\u003cbr\u003eExample::\u003cbr\u003e\u003cbr\u003e    {\u003cbr\u003e        \"wage_m\": UnitAnnotatedColumn(values, unit=TTSIMUnit.EUR.PER_MONTH),\u003cbr\u003e        \"rent_m_bg\": UnitAnnotatedColumn(\u003cbr\u003e            values, unit=TTSIMUnit.EUR.PER_MONTH.PER_BG\u003cbr\u003e        ),\u003cbr\u003e        \"p_id\": UnitAnnotatedColumn(values, unit=TTSIMUnit.DIMENSIONLESS),\u003cbr\u003e    }","warn_if\u003cbr\u003eevaluation_date_set_in_multiple_places\u003cbr\u003e\u003cbr\u003eWarn if more than one of the following hold true:\u003cbr\u003e- `evaluation_date` is passed as an argument to `main`\u003cbr\u003e- `evaluation_year` is present in the policy environment and it is not a PolicyInput\u003cbr\u003e- `evaluation_year` is part of the data","warn_if\u003cbr\u003efunctions_and_data_columns_overlap\u003cbr\u003e\u003cbr\u003eWarn if functions are overridden by data.","warn_if\u003cbr\u003estatutory_currency_and_default_data_currency_differ\u003cbr\u003e\u003cbr\u003eWarn when statutory currency differs and data uses the default currency.","warn_if\u003cbr\u003ett_dag_includes_function_with_warn_msg_if_included_set\u003cbr\u003e\u003cbr\u003eWarn if the TT DAG includes functions with `warn_msg_if_included` set.","warn_if\u003cbr\u003ett_function_type_annotations_turned_off\u003cbr\u003e\u003cbr\u003eWarn if `tt_function_set_annotations` is set to False.","tt_targets\u003cbr\u003eqname\u003cbr\u003e\u003cbr\u003eTargets in their qualified name-representation.","tt_targets\u003cbr\u003etree\u003cbr\u003e\u003cbr\u003eTargets as a tree. Will typically be provided by the user.\u003cbr\u003e\u003cbr\u003eIf requesting `df_with_mapper` as a main target, the leaves must be the desired\u003cbr\u003ecolumn names.\u003cbr\u003e\u003cbr\u003eIf not provided, the targets will be inferred from the policy environment (i.e.,\u003cbr\u003euse all ColumnFunctions in the policy environment).","templates\u003cbr\u003einput_data_dtypes\u003cbr\u003edf_with_nested_columns\u003cbr\u003e\u003cbr\u003eA template of the required input data and their expected types.","templates\u003cbr\u003einput_data_dtypes\u003cbr\u003etree\u003cbr\u003e\u003cbr\u003eA template of the required input data and their expected types.","input_data\u003cbr\u003eflat\u003cbr\u003e\u003cbr\u003eThe input data as a flat dictionary of arrays.","labels\u003cbr\u003edata_qnames\u003cbr\u003e\u003cbr\u003eThe qualified names of data columns available to the computation.\u003cbr\u003e\u003cbr\u003e`labels__data_qnames` has alternative producers because input data can enter the\u003cbr\u003einterface DAG through different routes:\u003cbr\u003e\u003cbr\u003e    input_data__flat ────────────→ labels__data_qnames\u003cbr\u003e    processed_data ──────────────→ labels__data_qnames\u003cbr\u003e    neither input is supplied ───→ labels__data_qnames (empty)\u003cbr\u003e\u003cbr\u003eIn particular, directly supplied `processed_data` bypasses `input_data__flat`.\u003cbr\
